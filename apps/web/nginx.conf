server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # MPA + SPA fallback (editeur.html, projets.html, …)
    location / {
        try_files $uri $uri/ $uri.html /index.html;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|woff2?|wasm)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
}
